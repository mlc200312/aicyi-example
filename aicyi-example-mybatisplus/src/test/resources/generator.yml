# =========================================================
# MyBatis-Plus 代码生成器配置
# 位置: src/test/resources/generator.yml
# =========================================================

datasource:
  url: jdbc:mysql://localhost:3306/test?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&verifyServerCertificate=false&useLegacyDatetimeCode=false&serverTimezone=UTC&allowMultiQueries=true
  username: root
  password: root

global:
  # 模块名（相对 workspace 根目录，即生成目标模块）
  project: /aicyi-example-mybatisplus
  author: Leno
  # 需要去掉的表前缀
  tablePrefix: t_

package:
  parent: io.github.aicyi.example
  moduleName: mybatisplus
  entity: domain.entity
  mapper: mapper
  service: service
  serviceImpl: service.impl

column-type:
  # 按列名指定 Java 类型，列名大小写不敏感），分两级：
  #   1. "*" 或 "global" 全局配置：对所有表生效（表级未配置时回退全局）
  #   2. 表级配置：优先于全局，表名写 t_user 或 user 均可
  # 取值支持：
  #   1. 任意类的全限定名，如业务枚举
  #   2. JDK 内置类型简名，如 Boolean / Integer / LocalDateTime
  java-type:
    "*":
      birthday: java.time.LocalDate
      deleted: java.lang.Boolean
      enabled: java.lang.Boolean
    t_user:
      gender_type: io.github.aicyi.example.mybatisplus.domain.type.GenderType
    message_template:
      variables: java.util.List
    # 按列名指定 TypeHandler（生成 @TableField(typeHandler = Xxx.class)，列名大小写不敏感），分两级：
    #   1. "*" 或 "global" 全局配置：对所有表生效（表级未配置时回退全局）
    #   2. 表级配置：优先于全局，表名写 t_user 或 user 均可
    # 取值必须是 TypeHandler 实现类的全限定名，示例：
  type-handlers:
    "*":
      json_info: com.baomidou.mybatisplus.extension.handlers.JacksonTypeHandler
    message_template:
      variables: io.github.aicyi.midware.db.mybatisplus.handlers.StringListTypeHandler
