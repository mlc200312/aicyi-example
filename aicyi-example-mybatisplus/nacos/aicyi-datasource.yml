# Nacos dataId: aicyi-datasource.yml
# group: DEFAULT_GROUP，格式：YAML
# datasource 环境配置（由 application-test.yml 迁移拆分而来，需导入到各环境对应的 namespace）


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&verifyServerCertificate=false&useLegacyDatetimeCode=false&serverTimezone=UTC&allowMultiQueries=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000