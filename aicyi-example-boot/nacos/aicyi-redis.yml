# Nacos dataId: aicyi-redis.yml
# group: DEFAULT_GROUP，格式：YAML
# redis 环境配置（由 application-test.yml 迁移拆分而来，需导入到各环境对应的 namespace）

spring:
  redis:
    host: localhost
    port: 6379
    password: root
    database: 0
    timeout: 5000
    jedis:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
