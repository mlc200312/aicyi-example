# Nacos dataId: aicyi-example-test.yml
# group: DEFAULT_GROUP，格式：YAML
# test 环境配置（由 application-test.yml 迁移而来）

logging:
  level:
    root: INFO
  # 重写logback模版 默认：common-logging下的logback-spring.xml
  config: classpath:logback-spring.xml

aicyi:
  snowflake:
    enabled: true
    service-name: default-service
    worker-id-bits: 5
    datacenter-id: 0
    ttl-seconds: 60
    heartbeat-seconds: 20
    auto-recover: true
    clock-backward-tolerance-ms: 5
    epoch: 1672531200000

  message:

    template:
      enabled: true

    email:
      enabled: true
      host: smtp.163.com
      port: -1
      # 敏感凭证通过部署环境的环境变量注入，不写入配置中心明文
      username: ${MAIL_USERNAME:minlc1024@163.com} # your-account@example.com
      password: ${MAIL_PASSWORD:FMBHOGEPRJONSQQQ} # your-smtp-auth-code
      from-name: minliangchao

    sms:
      enabled: true
      provider: default
      # 敏感凭证通过部署环境的环境变量注入，不写入配置中心明文
      username: ${SMS_ACCOUNT_SID:AC56dfa4c2d3284693ddebd2834b499486} # your-sms-account-sid
      password: ${SMS_AUTH_TOKEN:c20f2f9c73b6c5b795cd04c168d1c2c8} # your-sms-auth-token
      from: ${SMS_FROM_NUMBER:+19472182422} # +10000000000

    mq:
      enabled: true
      provider: rabbitMq