server:
  port: 80

mybatis:
  configuration:
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: io.github.aicyi.midware.db.commons.ibatis.IbatisLogger

spring:
  profiles:
    active: test

  freemarker:
    check-template-location: false

  application:
    name: aicyi-example

  # 从 Nacos 配置中心读取配置（spring-cloud-alibaba 2021.0.x 采用 config-import 机制，无需 bootstrap.yml）
  # 共享配置：aicyi-example.yml；环境配置在 application-{profile}.yml 中按 dataId aicyi-example-{profile}.yml 导入
  # 配置内容见模块根目录 nacos/，需先导入 Nacos 后再启动应用
  config:
    import:
      - nacos:aicyi-example.yml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      config:
        # Nacos 地址，可通过环境变量 NACOS_SERVER_ADDR 覆盖
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
        # Nacos 开启鉴权时通过环境变量注入账号密码
        # username: ${NACOS_USERNAME:nacos}
        # password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: true

    stream:
      # 绑定配置
      bindings:
        message-output:
          destination: default.exchange
          group: default.queue
          content-type: application/json
          binder: rabbit
          producer:
            required-groups: default.queue # 确保消费者组存在

        delayed-output:
          destination: delayed.exchange
          group: delayed.queue
          binder: rabbit

        direct-output:
          destination: direct.exchange
          group: direct.queue
          binder: rabbit

        topic-output:
          destination: topic.exchange
          content-type: application/json
          binder: rabbit

      # RabbitMQ特定配置
      rabbit:
        bindings:
          message-output:
            producer:
              exchange-type: topic # 消息模式：topic
              delayed-exchange: false # 不自动声明延迟交换机
              declare-exchange: false # 不自动声明交换机
              bind-queue: false # 不自动绑定队列

          delayed-output:
            producer:
              exchange-type: topic
              declare-exchange: false
              bind-queue: false
              routing-key-expression: "'delayed.routing.key'" # 静态路由键

          direct-output:
            producer:
              exchange-type: direct # 消息模式：direct
              declare-exchange: false
              bind-queue: false
              routing-key-expression: "'direct.routing.key'" # 静态路由键

          topic-output:
            producer:
              exchange-type: topic
              declare-exchange: false
              bind-queue: false
              routing-key-expression: headers['routingKey'] # 动态路由键

  mvc:
    path-match:
      matching-strategy: ant_path_matcher

aicyi:
  snowflake:
    enabled: true
    service-name: default-service
    worker-id-bits: 5
    datacenter-id: 0
    ttl-seconds: 60
    heartbeat-seconds: 20
    auto-recover: true
    clock-backward-tolerance-ms: 5
    epoch: 1672531200000
