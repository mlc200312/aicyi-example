  redis:
    host: localhost
    port: 6379
    password: root
    database: 0
    timeout: 5000

  cloud:
    stream:
      # 默认绑定器配置
      default-binder: rabbit

      # 绑定器配置
      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: localhost
                port: 5672
                username: test
                password: test
                virtual-host: /

  # RabbitMQ原生配置
  rabbitmq:
    dynamic: false
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          stateless: true

aicyi:
  message:

    template:
      enabled: true

    email:
      enabled: true
      host: smtp.163.com
      port: 465
      # 敏感凭证禁止明文入库，通过环境变量注入
      username: ${MAIL_USERNAME:your-account@example.com}
      password: ${MAIL_PASSWORD:your-smtp-auth-code}
      from-name: minliangchao

    sms:
      enabled: true
      provider: default
      # 敏感凭证禁止明文入库，通过环境变量注入
      username: ${SMS_ACCOUNT_SID:your-sms-account-sid}
      password: ${SMS_AUTH_TOKEN:your-sms-auth-token}
      from: ${SMS_FROM_NUMBER:+10000000000}

    mq:
      enabled: true
      provider: rabbitMq