# 环境相关配置已迁移至 Nacos 配置中心
# test 环境专用 namespace，可用环境变量 NACOS_NAMESPACE 覆盖
# 配置内容见模块根目录 nacos/，需先导入 Nacos 后再启动应用
spring:
  cloud:
    nacos:
      config:
        # test 环境 namespace（Nacos 控制台 → 命名空间 → 命名空间 ID）
        namespace: ${NACOS_NAMESPACE:29b4684f-0751-4290-a0a4-f65a51893ef6}

  config:
    import:
      - nacos:aicyi-example.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:aicyi-example-test.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:aicyi-datasource.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:aicyi-redis.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:aicyi-rabbitmq.yml?group=DEFAULT_GROUP&refreshEnabled=true


springdoc:
  # API 文档基础路径（默认 /v3/api-docs）
  api-docs:
    enabled: true
    path: /v3/api-docs
  # Swagger UI 界面配置
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 禁用默认的 Petstore 示例接口
    disable-swagger-default-url: true
