# Nacos dataId: aicyi-example.yml
# group: DEFAULT_GROUP，格式：YAML
# 共享配置（所有环境生效）

mybatis:
  configuration:
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: io.github.aicyi.midware.db.commons.ibatis.IbatisLogger

spring:
  freemarker:
    check-template-location: false

springdoc:
  # OpenAPI 数据端点：springdoc 2.x 为 /v3/api-docs（springfox 时代的 /v2/api-docs 已废弃）
  api-docs:
    enabled: true
    path: /v3/api-docs
    # 固定输出 OpenAPI 3.0.x：3.1 改用 type 数组并移除 nullable 来表达可空，
    # 与自研 UI（/apidoc）及多数下游客户端的 3.0 解析语义不兼容
    version: openapi_3_0
    # 开启 GroupedOpenApi 分组端点 /v3/api-docs/{group}，分组清单由 /v3/api-docs/swagger-config 暴露
    groups:
      enabled: true
  # 官方 Swagger UI 界面（/swagger-ui/index.html）；自研 UI 入口为 /apidoc/index.html
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 禁用默认的 Petstore 示例接口
    disable-swagger-default-url: true
    # 分组、tag、接口均按字母序，避免每次启动顺序抖动
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
  # 文档缓存：多分组下可显著降低重复扫描开销
  cache:
    disabled: false