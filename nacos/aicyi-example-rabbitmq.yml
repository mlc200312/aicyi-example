# Nacos dataId: aicyi-example-rabbitmq.yml
# group: DEFAULT_GROUP，格式：YAML
# =============================================================================
# 生产环境配置（Stream 4.x 函数式模型）
# 拓扑预建：交换机 / 队列 / 绑定 / 死信路由均由 init-rabbitmq.sh 或运维工单预先创建，
# 应用侧全局关闭自动声明（declare-exchange=false, bind-queue=false）。
# 队列缺失时启动失败（missing-queues-fatal=true），保证资源完备性。
# =============================================================================
spring:
  cloud:
    # 函数定义（SCS 4.x 必须）
    function:
      definition: messageInput;delayedInput;directInput;orderEvents;systemLogs

    stream:
      bindings:
        # ---------- 生产者绑定 ----------
        message-output:
          destination: default.exchange
          producer:
            required-groups: default.queue   # 确保消费者组存在

        delayed-output:
          destination: delayed.exchange

        direct-output:
          destination: direct.exchange

        topic-output:
          destination: topic.exchange

        # ---------- 消费者绑定 ----------
        # 注意：group 必须与脚本创建的队列名逐字一致（含交换机前缀）
        messageInput-in-0:
          destination: default.exchange
          group: default.queue
          consumer:
            concurrency: 3                    # 调优，保留

        delayedInput-in-0:
          destination: delayed.exchange
          group: delayed.queue

        directInput-in-0:
          destination: direct.exchange
          group: direct.queue

        orderEvents-in-0:
          destination: topic.exchange
          group: topic.exchange.order-service   # 与脚本创建的队列名完全一致

        systemLogs-in-0:
          destination: topic.exchange
          group: topic.exchange.log-service     # 与脚本创建的队列名完全一致

      # ---------- RabbitMQ 全局默认值（所有 Binding 共享） ----------
      rabbit:
        default:
          producer:
            declare-exchange: false           # 全局禁止自动声明交换机
            bind-queue: false                 # 全局禁止自动绑定队列（对生产者仅语义）
          consumer:
            declare-exchange: false           # 全局禁止消费者自动声明交换机
            bind-queue: false                 # 全局禁止消费者自动声明并绑定队列
            queue-name-group-only: true       # 队列名严格等于 group 值，不附加前缀
            republish-to-dlq: false           # 关闭 binder 内部重投，使用 broker 原生 DLX

        # ---------- 各 Binding 特有配置（仅覆盖必要的业务差异） ----------
        bindings:
          # 生产者特有：路由键 / 交换机类型（非默认 topic 才需显式）
          delayed-output:
            producer:
              routing-key-expression: "'delayed.routing.key'"

          direct-output:
            producer:
              exchange-type: direct            # 非默认，保留但 declare-exchange=false 时仅作文档
              routing-key-expression: "'direct.routing.key'"

          topic-output:
            producer:
              routing-key-expression: headers['routingKey']   # 动态路由键

          # 消费者特有：除 concurrency 外均无额外配置（全局已覆盖）
          # 若某消费者需要不同并发数，可在此添加 consumer.concurrency 覆盖
          # 示例：messageInput-in-0 已配置 concurrency=3，其余保持默认 1