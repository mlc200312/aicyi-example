# Nacos dataId: aicyi-rabbitmq.yml
# group: DEFAULT_GROUP，格式：YAML
# RabbitMQ 环境配置（由 application-test.yml 迁移拆分而来，需导入到各环境对应的 namespace）

spring:
  cloud:
    stream:
      # 默认绑定器配置
      default-binder: rabbit

      # 绑定器配置
      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: localhost
                port: 5672
                # 本地开发保留弱口令默认值以便开箱即跑；非 localhost 环境必须由环境变量注入
                username: ${RABBITMQ_USERNAME:test}
                password: ${RABBITMQ_PASSWORD:test}
                virtual-host: /

  # RabbitMQ原生配置
  rabbitmq:
    dynamic: false
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms
    listener:
      simple:
        missing-queues-fatal: true   # 显式开启（默认即为 true，此处强调）
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          stateless: true
