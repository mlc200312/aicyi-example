# Nacos dataId: aicyi-example-prod.yml
# group: DEFAULT_GROUP，格式：YAML
# prod 环境配置（由 aicyi-example-test.yml 复制而来，敏感凭证必须改为环境变量注入）
# 需导入到 prod 对应的 namespace；应用侧 application-prod.yml 会导入本文件

aicyi:
  snowflake:
    enabled: true
    service-name: aicyi-example-prod   # 生产多实例部署时必须配置为唯一服务名
    worker-id-bits: 5
    datacenter-id: 0
    ttl-seconds: 60
    heartbeat-seconds: 20
    auto-recover: true
    clock-backward-tolerance-ms: 5
    epoch: 1672531200000

  message:
    email:
      host: smtp.example.com
      port: 465
      # 敏感凭证通过部署环境的环境变量注入，不写入配置中心明文
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      from-name: aicyi

    sms:
      provider: twilio               # 生产建议使用 twilio / yunPian
      username: ${SMS_ACCOUNT_SID}
      password: ${SMS_AUTH_TOKEN}
      from: ${SMS_FROM_NUMBER}

    mq:
      provider: rabbitMq
