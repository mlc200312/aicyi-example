logging:
  level:
    root: INFO
  # 重写logback模版 默认：common-logging下的logback-spring.xml
  config: classpath:logback-spring.xml

server:
  port: 8083

spring:
  profiles:
    active: test
  application:
    name: aicyi-example-xxljob
  cloud:
    # 从 Nacos 配置中心读取配置（spring-cloud-alibaba 2021.0.x 采用 config-import 机制，无需 bootstrap.yml）
    # namespace 按环境区分：namespace 与 nacos 导入均声明在 application-{profile}.yml 中，随 profile 切换
    # 配置内容见模块根目录 nacos/，需先导入 Nacos 后再启动应用
    nacos:
      config:
        # Nacos 地址，可通过环境变量 NACOS_SERVER_ADDR 覆盖
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
        # Nacos 开启鉴权时通过环境变量注入账号密码
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: true
        # namespace 按环境区分，在 application-{profile}.yml 中声明，不在此处写死